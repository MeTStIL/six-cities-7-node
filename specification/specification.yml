    CreateCommentDto:
      type: object
      description: Данные для создания нового комментария к предложению (3.3, 5.7)
      required:
        - text
        - rating
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 1024
          description: Текст комментария (от 5 до 1024 символов)
          example: An independent House, strategically located between Rembrand Square and National Opera.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Оценка предложения от 1 до 5
          example: 5

    CreateCommentWithOfferDto:
      type: object
      description: Данные для создания комментария с явным указанием ID предложения (5.7)
      required:
        - text
        - rating
        - offerId
      properties:
        offerId:
          type: string
          description: Идентификатор предложения, к которому относится комментарий
          example: 647f1f77bcf86cd799439022
        text:
          type: string
          minLength: 5
          maxLength: 1024
          description: Текст комментария (от 5 до 1024 символов)
          example: An independent House, strategically located between Rembrand Square and National Opera.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Оценка предложения от 1 до 5
          example: 5

    CommentRdo:
      type: object
      description: Объект комментария (3.3, 5.6.4, 5.7.5)
      required:
        - id
        - text
        - postDate
        - rating
        - author
      properties:
        id:
          type: string
          description: Уникальный идентификатор комментария
          example: 647f1f77bcf86cd799439033
        text:
          type: string
          minLength: 5
          maxLength: 1024
          description: Текст комментария
          example: An independent House, strategically located between Rembrand Square and National Opera.
        postDate:
          type: string
          format: date-time
          description: Дата и время создания комментария
          example: '2026-11-08T12:30:00.000Z'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Оценка от 1 до 5
          example: 5
