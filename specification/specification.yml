          $ref: '#/components/schemas/UserDto'

    ValidationError:
      type: object
      description: Детализированное описание ошибки валидации конкретного поля
      required:
        - property
        - message
      properties:
        property:
          type: string
          description: Имя поля, не прошедшего валидацию
          example: price
        value:
          description: Переданное невалидное значение
          example: 50
        message:
          type: string
          description: Описание ошибки валидации
          example: Price must be at least 100

    ValidationErrorResponse:
      type: object
      description: Структура ответа при ошибке валидации входящих данных (400 Bad Request)
      required:
        - error
        - message
        - details
      properties:
        error:
          type: string
          description: Тип или статус ошибки
          example: Bad Request
        message:
          type: string
          description: Общее описание ошибки
          example: Validation error on incoming data
        details:
          type: array
          description: Список ошибок по полям
          items:
            $ref: '#/components/schemas/ValidationError'

    ErrorResponse:
      type: object
      description: Стандартный формат ошибки сервиса
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Название ошибки
          example: Not Found
        message:
          type: string
          description: Описание ошибки
          example: Offer with specified ID was not found
