root: true
env:
  es2021: true
  node: true
parser: "@typescript-eslint/parser"
parserOptions:
  ecmaVersion: 2021
  sourceType: module
plugins:
  - "@typescript-eslint"
  - "unused-imports"
extends:
  - "plugin:@typescript-eslint/recommended"
  - "htmlacademy/node"
  - "prettier"
rules:
  node/file-extension-in-import: off

  "@typescript-eslint/no-unused-vars": off
  "unused-imports/no-unused-imports": "error"
  "unused-imports/no-unused-vars":
    - "warn"
    - vars: "all"
      varsIgnorePattern: "^_"
      args: "after-used"
      argsIgnorePattern: "^_"
